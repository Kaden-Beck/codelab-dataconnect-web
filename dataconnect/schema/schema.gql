# Movies
type Movie @table {
	id: String!
	title: String! @searchable
	"MPAA Rating (G, PG, PG-13, R)"
	rating: String! @default(value: "PG")
	posterUrl: String!
	releaseDate: Date!
	genre: String!
	description: String @searchable
	tags: [String]
	embedding: Vector @col(size: 768) # Enables vector search
}

type Role @table(key: ["movie", "actor"]) {
	movie: Movie!
	actor: Actor!
	character: String
	description: String
}

type Actor @table {
	id: String!
	name: String!
	imageUrl: String!
	birthDate: Date!
}

type User @table(key: "uid") {
	uid: String! @default(expr: "uuidV4()")
	imageUrl: String
	displayName: String
	username: String!
}

type Watch @table(key: ["user", "movie"]) {
	movie: Movie!
	user: User!
	"one of 'theater-premium' (IMAX), 'theater', 'home', 'mobile'"
	format: String
	watchDate: Date! @default(expr: "request.time")
	"A watch can optionally be associated with a review."
	review: Review @unique
}

type Review @table(key: ["user", "movie"]) {
	user: User!
	movie: Movie!
	"Integer between 0-10 corresponding to a star rating (0 = 0 stars, 5 = 2.5 stars, 10 = 5 stars)"
	rating: Int!
	review: String
	reviewTime: Timestamp! @default(expr: "request.time")
	embedding: Vector @col(size: 768)
}

type MovieStats
    @view(
        sql: """
        SELECT
          m.id as movie_id,
          -- FIX: Count distinct users instead of IDs (which no longer exist)
          COUNT(DISTINCT r.user_uid) AS review_count,
          AVG(r.rating) AS avg_rating,
          -- FIX: Count distinct users for watches as well
          COUNT(DISTINCT w.user_uid) AS watch_count
        FROM movie m
        LEFT JOIN review r on m.id = r.movie_id
        LEFT JOIN watch w ON m.id = w.movie_id
        GROUP BY m.id
        """
    )
{
    movie: Movie @unique
    watchCount: Int
    reviewCount: Int
    avgRating: Float
}
