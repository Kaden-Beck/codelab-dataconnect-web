mutation UpdateUser($displayName: String, $imageUrl: String, $username: String!)
@auth(level: USER) {
  user: user_upsert(
    data: {
      uid_expr: "auth.uid"
      displayName: $displayName
      imageUrl: $imageUrl
      username: $username
    }
  )
}

mutation AddWatch(
  $movieId: String!
  $format: String
  $watchDate: Date
) @auth(level: USER) {
  watch: watch_insert(
    data: {
      movieId: $movieId
      userUid_expr: "auth.uid"
      format: $format
      watchDate: $watchDate
    }
  )
}

mutation AddVerifiedReview($movieId: String!, $rating: Int!, $review: String) 
@transaction {
  
  # Step 1: Check if watch exists (Gatekeeper)
  verifyWatch: query @check(
      expr: "response.verifyWatch.watch.movie.id == $movieId",
      message: "You must watch the movie before reviewing it!"
  ) {
    watch(key: { 
        userUid_expr: "auth.uid", 
        movieId: $movieId 
    }) {
      movie { id }
    }
  }

  # Step 2: Create/Update the Review
  review_upsert(data: {
      userUid_expr: "auth.uid"
      movieId: $movieId
      rating: $rating
      review: $review
  })

  # Step 3: Update the Watch to point to this new Review
  # This fixes the UI so the review appears next to the watch in history
  watch_update(
    key: {
      userUid_expr: "auth.uid"
      movieId: $movieId
    }
    data: {
      # Link to the review we just upserted (they share the same composite key)
      review: {
        userUid_expr: "auth.uid"
        movieId: $movieId
      }
    }
  )
}

mutation DeleteWatch($movieId: String!) @auth(level: USER) {
  watch_delete(
    # distinct delete by composite key
    key: {
       userUid_expr: "auth.uid",
       movieId: $movieId
    }
  )
}

