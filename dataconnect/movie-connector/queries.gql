fragment MovieOverview on Movie {
	id
	rating
	title
	posterUrl
	genre
	releaseDate
	stats: movieStats_on_movie {
		watchCount
		reviewCount
		avgRating
	}
}

fragment ReviewOverview on Review {
	user {
		username
	}
	rating
	review
	reviewTime
	watch: watch_on_review {
		watchDate
		format
	}
}

query HomePage @auth(level: PUBLIC) {
	newReleases: movies(limit: 4, orderBy: [{ releaseDate: DESC }]) {
		...MovieOverview
	}
	topMovies: movieStatss(limit: 5, orderBy: [{ avgRating: DESC }]) {
		movie {
			...MovieOverview
		}
	}
	recentReviews: reviews(orderBy: [{ reviewTime: DESC }], limit: 10) {
		...ReviewOverview
		movie {
			...MovieOverview
		}
	}
}

query SearchMovies($query: String!) @auth(level: PUBLIC) {
	movies: movies_embedding_similarity(
		compare_embed: { text: $query, model: "text-embedding-005" }
		limit: 10
	) {
		...MovieOverview
		description
	}
}

query MoviePage($movieId: String!) @auth(level: PUBLIC) {
	movie(id: $movieId) {
		...MovieOverview
		description
		tags
		reviews: reviews_on_movie(orderBy: [{ reviewTime: DESC }], limit: 10) {
			...ReviewOverview
		}
		roles: roles_on_movie {
			character
			description
			actor {
				id
				name
				imageUrl
			}
		}
	}
}

query WatchHistoryPage($limit: Int) @auth(level: USER) {
    watches(
        where: { userUid: { eq_expr: "auth.uid" } }
        orderBy: [{ watchDate: DESC }]
        limit: $limit
    ) {
        watchDate
        format
        review {
            rating
            review
        }
        movie {
            id
            title
            posterUrl
            releaseDate
        }
    }
}


# Return a filtered of movies based on criteria
query BrowseMovies(
	# partial title to match - omit for all titles
	$partialTitle: String
	# earliest acceptable release date - omit for no lower bound
	$minDate: Date
	# latest acceptable release date - omit for no upper bound
	$maxDate: Date
	# lowest acceptable average rating for the movie, on a scale from 0.0 to 10.0
	$minRating: Float
	# array of acceptable ratings for the movie, such as ["G", "PG"] for family-friendly movies. omit for all ratings
	$ratings: [String!]
	# genres to allow results from. omit for all genres
	$genres: [String!]
) @auth(level: PUBLIC) {
	movies(
		where: {
			title: { contains: $partialTitle }
			releaseDate: { ge: $minDate, le: $maxDate }
			rating: { in: $ratings }
			genre: { in: $genres }
			movieStats_on_movie: { avgRating: { ge: $minRating } }
		}
		limit: 30
		orderBy: [{releaseDate: DESC}]
	) {
		...MovieOverview
	}
}

query GetMovies($ids: [String!]) @auth(level: PUBLIC) {
	movies(where: {id: {in: $ids}}) {
		...MovieOverview
	}
}

query DetailedWatchHistory @auth(level: USER) {
	watches(
		where: { userUid: { eq_expr: "auth.uid" } }
		orderBy: [{ watchDate: DESC }]
	) {
		watchDate
		format
		review {
			...ReviewOverview
		}
		movie {
			...MovieOverview
			description
			actors: actors_via_Role {
				name, id
			}
		}
	}
}


# 1. VECTOR SEARCH
# Uses the "text-embedding-005" model configured in your connector.yaml
query SearchMoviesVector($query: String!) @auth(level: PUBLIC) {
  movies_embedding_similarity(
    compare_embed: { model: "text-embedding-005", text: $query }
    method: L2
    within: 2
    limit: 10
  ) {
    ...MovieOverview
    description
  }
}

# 2. FULL TEXT SEARCH (FTS)
# Uses the @searchable directive on Title and Description
query SearchMoviesFTS($query: String!) @auth(level: PUBLIC) {
  # Standard Query Parsing (+ and - operators)
  query: movies_search(query: $query, queryFormat: QUERY, limit: 5) {
    ...MovieOverview
  }
  # Exact Phrase Match
  phrase: movies_search(query: $query, queryFormat: PHRASE, limit: 5) {
    ...MovieOverview
  }
  # Fuzzy/Plain Match
  plain: movies_search(query: $query, queryFormat: PLAIN, limit: 5) {
    ...MovieOverview
  }
}

# 3. ADVANCED FILTER SEARCH
# Manual filtering by Year, Rating, Genre, and specific fields
query SearchAll(
  $titleInput: String
  $minDate: Date!
  $maxDate: Date!
  $minAvgRating: Float!
  $genre: String # Optional exact match
) @auth(level: PUBLIC) {
  # Movies matching criteria
  movies(
    where: {
      _and: [
        { releaseDate: { ge: $minDate } }
        { releaseDate: { le: $maxDate } }
        # Filter by Average User Rating (from the View)
        { movieStats_on_movie: { avgRating: { ge: $minAvgRating } } }
        { genre: { contains: $genre } }
        { title: { contains: $titleInput } }
      ]
    }
    limit: 20
  ) {
    ...MovieOverview
  }
  
  # Actors matching name (Simple contains)
  actors(where: { name: { contains: $titleInput } }, limit: 5) {
    id
    name
    imageUrl
  }
}
